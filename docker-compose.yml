services:
  web:
    image: php:8.2-apache
    command: >
      bash -c "a2enmod rewrite
      && sed -ri 's!/var/www/html!/var/www/html/public!g' /etc/apache2/sites-available/000-default.conf
      && printf '\n<Directory /var/www/html/public>\n    AllowOverride All\n    Require all granted\n</Directory>\nAlias /assets /var/www/html/assets\n<Directory /var/www/html/assets>\n    Require all granted\n</Directory>\n' > /etc/apache2/conf-available/project.conf
      && a2enconf project
      && apache2-foreground"
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
